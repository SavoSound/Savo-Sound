<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Savo Sound</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background-image: url("background.png");
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
        }

        h1 {
            margin: 0;
            padding-top: 70px;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 110px;
            text-shadow: 0 0 12px #000,
                         0 0 32px #000,
                         0 0 63px #000,
                         0 0 113px #000,
                         0 0 175px #000;
        }
    
        .subtitle {
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            letter-spacing: 8px;
            margin-top: 4px;
            text-shadow: 0 0 10px #000,
                         0 0 30px #000,
                         0 0 65px #000,
                         0 0 110px #000,
                         0 0 170px #000,
                         0 0 240px #000;
        }
    
        .title-glow {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 850px;
            height: 260px;
            background: radial-gradient(
                ellipse,
                rgba(0,0,0,0.95) 0%,
                rgba(0,0,0,0.80) 30%,
                rgba(0,0,0,0.45) 55%,
                rgba(0,0,0,0) 78%
            );
            z-index: -1;
        }

        body {
            position: relative;
        }

        h1, .subtitle {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="title-glow"></div>
    <h1>SAVO SOUND</h1>
    <div class="subtitle">VST3 EFFECT PLUGINS</div>

<style>
.plugin-grid {
    width: min(1100px, 88vw);
    margin: 55px auto 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 1px solid rgba(255,255,255,0.75);
    min-height: calc(100vh - 260px);
    position: relative;
}

.plugin-grid::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 1px;
    background: rgba(255,255,255,0.75);
}

.plugin-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    padding-top: 35px;
    box-sizing: border-box;
    background: rgba(0,0,0,0.12);
}

.plugin-slot:nth-child(odd) {
}

.plugin-name {
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 3px;
    text-shadow:
        0 0 8px #000,
        0 0 20px #000,
        0 0 40px #000;
}
</style>

<div class="plugin-grid">
    <div class="plugin-slot">
        <a href="skrikern.html" class="plugin-name">Skriker`n</a>
        <a href="2000xl.html" class="plugin-name">2000XL</a>
    </div>

    <div class="plugin-slot">
        <a href="lysogvarme.html" class="plugin-name">Lys og Varme</a>
    </div>
</div>

</body>
</html>
